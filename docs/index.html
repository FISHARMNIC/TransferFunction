<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Transfer Functions</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.0.0/math.js"></script>
    <script src='https://cdn.plot.ly/plotly-3.4.0.min.js'></script>
    <script src="scripts/main.js" type="module"></script>
</head>

<body>
    <div id='chart'></div>
    <div class="stuff">
        <div class="labels">
            <div style="display: flex; gap: 20vw; align-items: flex-start;">
                <div>
                    <label>R (Ω):
                        <input type="number" id="R-number" step="10">
                        <br><input type="range" id="R" min="0.001" max="1" step="0.001"></label>
                    <label>L (F):
                        <input type="number" id="L-number" step="10">
                        <br><input type="range" id="L" min="0.001" max="1" step="0.001"></label>
                    <label>C (C):
                        <input type="number" id="C-number" step="10">
                        <br><input type="range" id="C" min="0.001" max="1" step="0.001"></label>
                </div>
                <div>
                    <label>Lower Exponent:<span id="LB-value" class="value-span">10^-4</span><br><input type="range"
                            id="LB" min="-10" max="-1" step="1" value="-4" onpointermove="_plot_active()"
                            oninput="document.getElementById('LB-value').textContent = `10^${this.value}`">
                    </label>

                    <label>Upper Exponent:<span id="UB-value" class="value-span">10^4</span><br><input type="range" id="UB"
                            min="1" max="10" step="1" value="4" onpointermove="_plot_active()"
                            oninput="document.getElementById('UB-value').textContent = `10^${this.value}`">
                    </label>

                    <!-- <label>Ultra Precision:<span id="PREC-value" class="value-span">1.01</span><br><input type="range"
                            id="PREC" min="1.005" max="2" step="0.01" value="1.01" onpointermove="_plot_active()"
                            oninput="document.getElementById('PREC-value').textContent = this.value">
                    </label> -->
                </div>
            </div>
        </div>
        <div class="scrolls">
            <div id="buttons">
                <div class="button-card no-hover">
                    <span class='title'>Custom Transfer Function</span><br>
                    <pre>Please follow the other examples. This uses <a href="https://mathjs.org/">math.js</a> and thus any function from that library can be used here.</pre>
                    <input id="get_custom">
                    <button id="set_custom">Set</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
